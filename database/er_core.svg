<text x="60.00" y="1691.00" font-family="Arial Narrow,Arial,sans-serif" font-size="43" font-weight="normal" fill="#111111">Связь category → subscription составная: (category_id, owner_id) → (id, owner_id).</text>
<text x="60.00" y="1752.00" font-family="Arial Narrow,Arial,sans-serif" font-size="43" font-weight="normal" fill="#111111">owner_id в subscription хранится намеренно: составной FK исключает выбор категории другого владельца.</text>
